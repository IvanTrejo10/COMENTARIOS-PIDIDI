<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html{overflow:hidden}
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#0f172a;font:15px/1.65 Inter,'Segoe UI',sans-serif}body{padding:2px 1px 7px}article{border:1px solid #dce5ed;background:white;border-radius:16px;overflow:hidden;box-shadow:0 4px 15px -12px #0f172a55}.card-head{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:17px 21px;border-bottom:1px solid #e5edf3;background:linear-gradient(120deg,#fff,#f5fafb)}.country{display:flex;gap:12px;align-items:center}.country-icon{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#e5f7f2;color:#0f766e;border:1px solid #c8eee3}.country h3{font-size:19px;letter-spacing:-.4px;margin:0;line-height:1.3}.country small{font-size:12px;color:#64748b}.variation{padding:6px 11px;border-radius:8px;font-size:14px;font-weight:650;white-space:nowrap}.negative{color:#b42335;background:#fff1f2;border:1px solid #ffe0e4}.positive{color:#08765c;background:#ecfdf5;border:1px solid #c5f2df}.neutral{color:#475569;background:#f1f5f9;border:1px solid #e2e8f0}.variation small{display:block;font-size:10px;font-weight:500}.content{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}.image-side{border-right:1px solid #e5edf3;padding:19px;background:#f8fafc;display:flex;flex-direction:column;justify-content:center}.label{font-size:11px;letter-spacing:.8px;font-weight:650;color:#64748b;margin:0 0 11px}.image-side img{display:block;width:100%;height:auto;border:1px solid #e2e8f0;border-radius:6px;background:#fff}.source{color:#64748b;font-size:11px;margin:11px 0 0;overflow-wrap:anywhere}.text-side{padding:20px 23px;display:flex;flex-direction:column;gap:11px}.text-side .label{display:flex;justify-content:space-between;align-items:center;margin-bottom:0}.text-side .label span{font-size:10px;color:#0f766e;background:#e8f8f2;padding:2px 6px;border-radius:4px;letter-spacing:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;margin:0;flex:1;color:#253449;font-size:15px;line-height:1.8}pre::first-line{font-weight:700;color:#0f172a}footer{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:13px 20px;border-top:1px solid #e5edf3}.buttons{display:flex;gap:8px;flex-wrap:wrap}button,a.download{font:600 13px/1.4 Inter,'Segoe UI',sans-serif;padding:9px 13px;border-radius:8px;cursor:pointer;border:1px solid #0d9488;background:#0d9488;color:white;text-decoration:none;display:inline-flex;align-items:center;gap:7px}button.secondary,a.download{background:#fff;color:#0f766e;border-color:#c5dfda}button:hover{filter:brightness(.96)}button:focus-visible,a:focus-visible{outline:3px solid #99f6e4;outline-offset:3px}.download{margin-left:auto}button.done{background:#065f46;color:white;border-color:#065f46}#status{margin:0;color:#47636c;font-size:12px;min-height:0}#status:not(:empty){padding:0 20px 13px}svg{flex-shrink:0}@media(max-width:720px){.content{grid-template-columns:1fr}.image-side{border-right:0;border-bottom:1px solid #e5edf3;padding:17px}.text-side{padding:18px}.card-head{padding:15px}.country h3{font-size:18px}.variation{font-size:12px}.variation small{font-size:9px}footer{padding:13px 15px}.download{margin-left:0}pre{font-size:15px}}@media(prefers-reduced-motion:reduce){*{transition:none}}
</style></head><body>
<article>
<header class="card-head"><div class="country"><div class="country-icon"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a17 17 0 0 1 0 18 17 17 0 0 1 0-18Z"/></svg></div><div><h3>__PAIS__</h3><small>Corte __CORTE__</small></div></div><div class="variation __TENDENCIA__"><small>Variación en recuperación</small>__VARIACION__</div></header>
<div class="content"><section class="image-side" aria-label="Imagen del reporte"><p class="label">IMAGEN DEL REPORTE · BOTTOM / TOP</p><img id="report-image" alt="Tablas Bottom y Top de __PAIS__" src="data:image/png;base64,__IMAGEN__"><p class="source">__ARCHIVO__ · Página __PAGINA__</p></section><section class="text-side" aria-label="Mensaje para WhatsApp"><p class="label">MENSAJE PARA WHATSAPP <span>LISTO PARA COPIAR</span></p><pre id="message">__MENSAJE__</pre></section></div>
<footer><div class="buttons"><button type="button" onclick="copyText(this)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h3"/></svg><span>Copiar mensaje</span></button><button type="button" class="secondary" onclick="copyImage(this)">Copiar imagen</button></div><a class="download" download="__PAIS___reporte.png" href="data:image/png;base64,__IMAGEN__">Descargar imagen</a></footer><p id="status" role="status" aria-live="polite"></p>
</article>
<script>
const statusNode=document.getElementById('status');
function success(button,text){const label=button.querySelector('span')||button;const original=label.textContent;label.textContent=text;button.classList.add('done');statusNode.textContent='';setTimeout(()=>{label.textContent=original;button.classList.remove('done')},1800)}
async function copyText(button){const text=document.getElementById('message').textContent;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text)}else{throw new Error('fallback')}success(button,'Mensaje copiado')}catch(error){const input=document.createElement('textarea');input.value=text;input.style.cssText='position:fixed;left:-9999px';document.body.appendChild(input);input.select();let copied=false;try{copied=document.execCommand('copy')}catch(e){}input.remove();if(copied){success(button,'Mensaje copiado')}else{statusNode.textContent='Selecciona el texto del mensaje para copiarlo o descarga el archivo TXT desde el panel.'}}}
async function copyImage(button){try{const bytes=Uint8Array.from(atob(document.getElementById('report-image').src.split(',')[1]),char=>char.charCodeAt(0));await navigator.clipboard.write([new ClipboardItem({'image/png':new Blob([bytes],{type:'image/png'})})]);success(button,'Imagen copiada')}catch(error){statusNode.textContent='Este navegador no permitió copiar la imagen. Usa Descargar imagen o haz clic derecho sobre ella y elige Copiar imagen.'}}
</script></body></html>
