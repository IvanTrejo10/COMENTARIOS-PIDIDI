<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
@property --beam {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: false;
}

:root {
  --ink: #F8FAFC;
  --ink-soft: #E2E8F0;
  --muted: #94A3B8;
  --dim: #64748B;
  --line: rgba(148, 163, 184, 0.16);
  --teal: #14B8A6;
  --mint: #5EEAD4;
  --cyan: #38BDF8;
  --display: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
  --sans: 'Inter', 'Segoe UI', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

@keyframes spinBeam { to { --beam: 360deg; } }

@keyframes cardEnter {
  0% { opacity: 0; transform: translateY(20px) scale(0.988); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

@keyframes pulseDot {
  0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7); }
  70% { box-shadow: 0 0 0 7px rgba(52, 211, 153, 0); }
  100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
}

@keyframes donePop {
  0% { transform: scale(0.95); }
  50% { transform: scale(1.04); }
  100% { transform: scale(1); }
}

@keyframes toastIn {
  0% { opacity: 0; transform: translateY(6px); }
  100% { opacity: 1; transform: translateY(0); }
}

@keyframes sparkFly {
  0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
  100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(140deg); opacity: 0; }
}

html { overflow: hidden; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: transparent;
  color: var(--ink);
  font: 15px/1.65 var(--sans);
}

body { padding: 4px 2px 14px; }

article {
  position: relative;
  border-radius: 22px;
  overflow: hidden;
  background: linear-gradient(165deg, rgba(14, 23, 44, 0.94), rgba(8, 14, 28, 0.97));
  border: 1px solid rgba(255, 255, 255, 0.09);
  box-shadow: 0 24px 56px -24px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.09);
  animation: cardEnter 0.6s var(--ease) both;
  animation-delay: __DELAY_MS__ms;
  transition: border-color 0.35s, box-shadow 0.35s;
}

/* Spotlight interactivo que sigue al cursor */
article::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(540px circle at var(--mx, 50%) var(--my, 0%), var(--spot, rgba(45, 212, 191, 0.13)), transparent 55%);
  opacity: 0;
  transition: opacity 0.35s ease;
  pointer-events: none;
  z-index: 1;
}
article.mexico { --spot: rgba(45, 212, 191, 0.14); }
article.latam { --spot: rgba(56, 189, 248, 0.14); }
article.saludo { --spot: rgba(251, 191, 36, 0.13); }
article.tramites { --spot: rgba(167, 139, 250, 0.14); }
article:hover::before { opacity: 1; }

/* Haz prismático sutil en el borde */
article::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1.5px;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
  pointer-events: none;
  opacity: 0.28;
  transition: opacity 0.4s ease;
  animation: spinBeam 7s linear infinite;
  z-index: 3;
}
article.mexico::after {
  background: conic-gradient(from var(--beam), transparent 0deg, transparent 245deg, #10B981 308deg, #5EEAD4 342deg, transparent 360deg);
}
article.latam::after {
  background: conic-gradient(from var(--beam), transparent 0deg, transparent 245deg, #3B82F6 308deg, #818CF8 342deg, transparent 360deg);
}
article.saludo::after {
  background: conic-gradient(from var(--beam), transparent 0deg, transparent 235deg, #F59E0B 300deg, #5EEAD4 342deg, transparent 360deg);
  opacity: 0.48;
}
article.tramites::after {
  background: conic-gradient(from var(--beam), transparent 0deg, transparent 240deg, #8B5CF6 305deg, #38BDF8 342deg, transparent 360deg);
}
article:hover::after { opacity: 0.88; }

.accent-bar {
  position: relative;
  z-index: 2;
  height: 3px;
  width: 100%;
  background-size: 200% 100%;
  animation: gradientShift 6s ease infinite;
}
.accent-bar.mexico { background-image: linear-gradient(90deg, #059669, #2DD4BF, #38BDF8, #059669); }
.accent-bar.latam { background-image: linear-gradient(90deg, #2563EB, #6366F1, #38BDF8, #2563EB); }
.accent-bar.saludo { background-image: linear-gradient(90deg, #F59E0B, #FDE68A, #2DD4BF, #F59E0B); }
article.tramites .accent-bar { background-image: linear-gradient(90deg, #7C3AED, #6366F1, #38BDF8, #7C3AED); }

/* Cabecera */
.card-head {
  position: relative;
  z-index: 2;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 18px 24px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.07);
  background: linear-gradient(125deg, rgba(255, 255, 255, 0.03), transparent 70%);
}

.country { display: flex; gap: 14px; align-items: center; min-width: 0; }

.country-emblem {
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  border-radius: 15px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 10px 24px -10px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.14);
  flex-shrink: 0;
  transition: transform 0.35s var(--ease);
}
article:hover .country-emblem { transform: scale(1.07) rotate(-4deg); }

.saludo-ico {
  display: grid;
  place-items: center;
  color: #FDE68A;
  filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.55));
}
article.saludo .country-emblem {
  background: linear-gradient(145deg, rgba(245, 158, 11, 0.22), rgba(20, 184, 166, 0.16));
  border-color: rgba(253, 230, 138, 0.35);
}

.flag-circle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  overflow: hidden;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.25);
}
.flag-circle svg { display: block; width: 100%; height: 100%; }
.flag-circle.fallback { background: #1E293B; color: #94A3B8; }

.country-info { min-width: 0; }
.country-title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.country h3 {
  font: 800 21px/1.18 var(--display);
  letter-spacing: -0.03em;
  color: #F8FAFC;
  margin: 0;
}

.region-badge,
.tipo-badge {
  font-family: var(--mono);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.1em;
  padding: 3px 9px;
  border-radius: 999px;
}
.region-badge.mexico {
  color: #5EEAD4;
  background: rgba(20, 184, 166, 0.16);
  border: 1px solid rgba(94, 234, 212, 0.32);
}
.region-badge.latam {
  color: #93C5FD;
  background: rgba(59, 130, 246, 0.16);
  border: 1px solid rgba(147, 197, 253, 0.32);
}
.region-badge.saludo {
  color: #FDE68A;
  background: rgba(245, 158, 11, 0.16);
  border: 1px solid rgba(253, 230, 138, 0.35);
}
.tipo-badge {
  color: #C4B5FD;
  background: rgba(139, 92, 246, 0.18);
  border: 1px solid rgba(167, 139, 250, 0.38);
}

.country-sub {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 5px;
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--muted);
}
.country-sub svg { color: var(--mint); }

/* Pill de variación luminosa */
.variation {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 9px 15px;
  border-radius: 14px;
  white-space: nowrap;
  flex-shrink: 0;
  transition: transform 0.25s var(--ease);
}
.variation:hover { transform: translateY(-2px); }

.var-icon {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 10px;
  flex-shrink: 0;
}
.var-copy small {
  display: block;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.03em;
  opacity: 0.85;
  line-height: 1.2;
}
.var-copy strong {
  display: block;
  font-family: var(--display);
  font-size: 17px;
  font-weight: 800;
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
  margin-top: 2px;
}

.variation.positive {
  color: #6EE7B7;
  background: rgba(16, 185, 129, 0.14);
  border: 1px solid rgba(52, 211, 153, 0.34);
  box-shadow: 0 0 24px -10px rgba(16, 185, 129, 0.65);
}
.variation.positive .var-icon { background: #10B981; color: #031A14; }

.variation.negative {
  color: #FDA4AF;
  background: rgba(244, 63, 94, 0.14);
  border: 1px solid rgba(251, 113, 133, 0.34);
  box-shadow: 0 0 24px -10px rgba(244, 63, 94, 0.65);
}
.variation.negative .var-icon { background: #F43F5E; color: #FFFFFF; }

.variation.neutral {
  color: #CBD5E1;
  background: rgba(148, 163, 184, 0.12);
  border: 1px solid rgba(148, 163, 184, 0.25);
}
.variation.neutral .var-icon { background: #475569; color: #FFFFFF; }

/* Cuerpo dividido y vista ampliada */
.content {
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: minmax(0, 1.18fr) minmax(0, 1fr);
}
.content.expanded { grid-template-columns: 1fr; }

/* Galería iluminada para el reporte Power BI */
.image-side {
  border-right: 1px solid rgba(255, 255, 255, 0.07);
  padding: 20px 22px;
  background:
    radial-gradient(rgba(148, 163, 184, 0.14) 1px, transparent 1px),
    rgba(6, 11, 23, 0.62);
  background-size: 18px 18px, auto;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 13px;
}
.content.expanded .image-side {
  border-right: 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.07);
}

.panel-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.label {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  font-weight: 600;
  color: var(--muted);
  margin: 0;
}

.zoom-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font: 600 11.5px/1 var(--sans);
  color: #CBD5E1;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9px;
  padding: 6px 11px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.24s var(--ease);
}
.zoom-btn:hover {
  color: #5EEAD4;
  background: rgba(20, 184, 166, 0.14);
  border-color: rgba(94, 234, 212, 0.45);
  transform: translateY(-1px);
}

.image-frame {
  position: relative;
  border-radius: 15px;
  padding: 8px;
  background: linear-gradient(180deg, #F8FAFC, #EFF4F9);
  border: 1px solid rgba(148, 163, 184, 0.35);
  box-shadow:
    0 22px 48px -18px rgba(0, 0, 0, 0.88),
    0 0 0 4px rgba(15, 23, 42, 0.55),
    0 0 28px -12px rgba(94, 234, 212, 0.25);
  cursor: zoom-in;
  overflow: hidden;
  transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease);
}
.content.expanded .image-frame { cursor: zoom-out; }
.image-frame:hover {
  transform: translateY(-3px) scale(1.006);
  box-shadow:
    0 28px 56px -18px rgba(0, 0, 0, 0.94),
    0 0 0 4px rgba(20, 184, 166, 0.2),
    0 0 38px -10px rgba(94, 234, 212, 0.38);
}
.image-frame img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 8px;
  background: #FFFFFF;
}

.source {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #94A3B8;
  font-family: var(--mono);
  font-size: 11.5px;
  margin: 0;
  overflow-wrap: anywhere;
}
.source svg { color: #5EEAD4; flex-shrink: 0; opacity: 0.78; }

/* Estudio WhatsApp Dark Mode */
.text-side {
  padding: 20px 22px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: rgba(9, 16, 31, 0.55);
}

.msg-badges { display: inline-flex; align-items: center; gap: 7px; }

.char-badge {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  color: #94A3B8;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.09);
  padding: 3px 8px;
  border-radius: 6px;
}

.ready-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  color: #6EE7B7;
  background: rgba(16, 185, 129, 0.14);
  border: 1px solid rgba(52, 211, 153, 0.34);
  padding: 3px 9px;
  border-radius: 999px;
}
.ready-pill i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #34D399;
  animation: pulseDot 2.2s infinite;
}

.wa-stage {
  flex: 1;
  display: flex;
  flex-direction: column;
  border-radius: 16px;
  padding: 15px;
  background:
    radial-gradient(rgba(45, 212, 191, 0.08) 1px, transparent 1px),
    linear-gradient(160deg, #07131A 0%, #0A1822 100%);
  background-size: 15px 15px, auto;
  border: 1px solid rgba(45, 212, 191, 0.14);
}

.wa-bubble {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: linear-gradient(155deg, rgba(13, 47, 46, 0.92), rgba(10, 34, 40, 0.96));
  border: 1px solid rgba(45, 212, 191, 0.24);
  border-radius: 4px 16px 16px 16px;
  padding: 16px 18px 12px;
  box-shadow: 0 12px 28px -14px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(94, 234, 212, 0.14);
}

pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-family: var(--sans);
  margin: 0;
  flex: 1;
  color: #E2E8F0;
  font-size: 14.5px;
  line-height: 1.78;
}
pre::first-line {
  font-weight: 700;
  color: #5EEAD4;
}

.wa-bubble-foot {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 5px;
  margin-top: 12px;
  padding-top: 8px;
  border-top: 1px dashed rgba(94, 234, 212, 0.16);
  font-family: var(--mono);
  font-size: 10.5px;
  color: #94A3B8;
}
.wa-bubble-foot svg { color: #38BDF8; }

/* Pie de acciones */
footer {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  padding: 15px 24px;
  border-top: 1px solid rgba(255, 255, 255, 0.07);
  background: rgba(6, 11, 22, 0.72);
}

.buttons { display: flex; gap: 9px; flex-wrap: wrap; }

.btn,
a.download {
  position: relative;
  font: 700 13px/1.2 var(--sans);
  padding: 10px 16px;
  border-radius: 12px;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease), background 0.25s, border-color 0.25s, color 0.25s;
}

.btn-primary {
  border: 1px solid rgba(94, 234, 212, 0.45);
  background: linear-gradient(120deg, #10B981 0%, #14B8A6 52%, #0EA5E9 100%);
  color: #031A19;
  box-shadow: 0 0 24px -6px rgba(20, 184, 166, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.45);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 34px -4px rgba(45, 212, 191, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.6);
}
.btn-primary:active { transform: translateY(0) scale(0.975); }

.btn-secondary {
  background: rgba(255, 255, 255, 0.05);
  color: #E2E8F0;
  border: 1px solid rgba(255, 255, 255, 0.14);
}
.btn-secondary:hover {
  background: rgba(20, 184, 166, 0.16);
  border-color: rgba(94, 234, 212, 0.5);
  color: #5EEAD4;
  transform: translateY(-2px);
  box-shadow: 0 8px 22px -10px rgba(45, 212, 191, 0.5);
}
.btn-secondary:active { transform: translateY(0) scale(0.975); }

a.download {
  margin-left: auto;
  background: rgba(255, 255, 255, 0.035);
  color: #CBD5E1;
  border: 1px solid rgba(255, 255, 255, 0.11);
  font-weight: 600;
}
a.download:hover {
  color: #F8FAFC;
  background: rgba(255, 255, 255, 0.09);
  border-color: rgba(255, 255, 255, 0.25);
  transform: translateY(-2px);
}
a.download svg { transition: transform 0.25s var(--ease); }
a.download:hover svg { transform: translateY(2px); }

.btn:focus-visible,
a.download:focus-visible,
.zoom-btn:focus-visible {
  outline: 2px solid #5EEAD4;
  outline-offset: 2px;
}

.btn.done {
  background: linear-gradient(120deg, #10B981, #34D399) !important;
  color: #031B15 !important;
  border-color: #6EE7B7 !important;
  box-shadow: 0 0 28px -4px rgba(52, 211, 153, 0.85) !important;
  animation: donePop 0.35s var(--ease);
}

/* Partículas micro-sparkle */
.spark-particle {
  position: fixed;
  width: 6px;
  height: 6px;
  border-radius: 2px;
  pointer-events: none;
  z-index: 99;
  animation: sparkFly 0.65s var(--ease) forwards;
}

#status {
  position: relative;
  z-index: 2;
  margin: 0;
  font-size: 12.5px;
  font-weight: 500;
  min-height: 0;
}
#status:not(:empty) {
  padding: 11px 24px 13px;
  background: rgba(16, 185, 129, 0.12);
  border-top: 1px solid rgba(52, 211, 153, 0.25);
  color: #6EE7B7;
  animation: toastIn 0.28s var(--ease);
}
#status.warn:not(:empty) {
  background: rgba(245, 158, 11, 0.12);
  border-top-color: rgba(251, 191, 36, 0.3);
  color: #FCD34D;
}

/* Modos especiales: Saludo del día y Trámites (Entregado) */
article.saludo .variation,
article.saludo .image-side,
article.saludo a.download,
article.saludo .btn-secondary {
  display: none !important;
}
article.saludo .content {
  grid-template-columns: 1fr;
}
article.saludo pre::first-line {
  font-weight: inherit;
  color: inherit;
}
article.saludo .wa-bubble {
  background: linear-gradient(145deg, rgba(24, 38, 52, 0.92), rgba(14, 34, 42, 0.96));
  border-color: rgba(253, 230, 138, 0.24);
}

article.tramites .image-frame img {
  width: auto;
  max-width: 100%;
  max-height: 330px;
  margin: 0 auto;
}
article.tramites .content.expanded .image-frame img {
  width: 100%;
  max-height: none;
}

svg { flex-shrink: 0; }

@media (max-width: 760px) {
  .content { grid-template-columns: 1fr; }
  .image-side { border-right: 0; border-bottom: 1px solid rgba(255, 255, 255, 0.07); padding: 16px; }
  .text-side { padding: 16px; }
  .card-head { padding: 15px 16px; flex-wrap: wrap; }
  .country h3 { font-size: 18px; }
  .variation { width: 100%; justify-content: space-between; }
  footer { padding: 13px 16px; }
  a.download { margin-left: 0; width: 100%; justify-content: center; }
  .buttons { width: 100%; }
  .buttons .btn { flex: 1; justify-content: center; }
  .zoom-btn { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    transition-duration: 0.001ms !important;
  }
}
</style>
</head>
<body>
<article id="card" class="__REGION_CLASS__ __MODO__">
  <div class="accent-bar __REGION_CLASS__"></div>
  <header class="card-head">
    <div class="country">
      <div class="country-emblem">__EMBLEM_HTML__</div>
      <div class="country-info">
        <div class="country-title-row">
          <h3>__PAIS__</h3>
          <span class="region-badge __REGION_CLASS__">__REGION_LABEL__</span>
          __TIPO_BADGE__
        </div>
        <div class="country-sub">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M8 2.5v4M16 2.5v4M3 9.5h18"/></svg>
          <span>Corte __CORTE__</span>
        </div>
      </div>
    </div>
    <div class="variation __TENDENCIA__">
      <span class="var-icon">__TREND_ICON__</span>
      <div class="var-copy">
        <small>__ROTULO_VAR__</small>
        <strong>__VARIACION__</strong>
      </div>
    </div>
  </header>

  <div class="content" id="card-content">
    <section class="image-side" aria-label="Imagen del reporte">
      <div class="panel-bar">
        <p class="label">__ROTULO_IMG__</p>
        <button type="button" class="zoom-btn" id="zoom-toggle" onclick="toggleZoom()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
          <span>Ampliar HD</span>
        </button>
      </div>
      <div class="image-frame" onclick="toggleZoom()" title="Haz clic para ampliar o reducir la imagen">
        <img id="report-image" alt="__ALT__" src="data:image/png;base64,__IMAGEN__">
      </div>
      <p class="source">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg>
        <span>__ARCHIVO__ · Página __PAGINA__</span>
      </p>
    </section>

    <section class="text-side" aria-label="Mensaje para WhatsApp">
      <div class="panel-bar">
        <p class="label">MENSAJE PARA WHATSAPP</p>
        <div class="msg-badges">
          <span class="char-badge" id="char-count"></span>
          <span class="ready-pill"><i></i>LISTO</span>
        </div>
      </div>
      <div class="wa-stage">
        <div class="wa-bubble">
          <pre id="message">__MENSAJE__</pre>
          <div class="wa-bubble-foot">
            <span>Vista previa WhatsApp</span>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2.5 12.5 4 4L15 8"/><path d="m9.5 15.5 2 2L21 8"/></svg>
          </div>
        </div>
      </div>
    </section>
  </div>

  <footer>
    <div class="buttons">
      <button type="button" class="btn btn-primary" onclick="copyText(this)">
        <span class="btn-ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h3"/></svg></span>
        <span class="btn-label">Copiar mensaje</span>
      </button>
      <button type="button" class="btn btn-secondary" onclick="copyImage(this)">
        <span class="btn-ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></span>
        <span class="btn-label">Copiar imagen</span>
      </button>
    </div>
    <a class="download" download="__DESCARGA__" href="data:image/png;base64,__IMAGEN__">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v13m-5-5 5 5 5-5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      <span>Descargar PNG</span>
    </a>
  </footer>
  <p id="status" role="status" aria-live="polite"></p>
</article>

<script>
const cardNode = document.getElementById('card');
const statusNode = document.getElementById('status');
const msgNode = document.getElementById('message');
const charBadge = document.getElementById('char-count');
const CHECK_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.2 4.2L19 7"/></svg>';
const SPARK_COLORS = ['#5EEAD4', '#38BDF8', '#34D399', '#A5B4FC', '#FDE68A'];
let statusTimer = null;

if (cardNode) {
  cardNode.addEventListener('pointermove', (e) => {
    const r = cardNode.getBoundingClientRect();
    cardNode.style.setProperty('--mx', (e.clientX - r.left) + 'px');
    cardNode.style.setProperty('--my', (e.clientY - r.top) + 'px');
  });
}

if (msgNode && charBadge) {
  charBadge.textContent = msgNode.textContent.trim().length + ' car.';
}

function burstSparks(button) {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r = button.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('span');
    p.className = 'spark-particle';
    const angle = (Math.PI * 2 * i) / 12 + (Math.random() - 0.5) * 0.35;
    const dist = 28 + Math.random() * 30;
    p.style.left = cx + 'px';
    p.style.top = cy + 'px';
    p.style.background = SPARK_COLORS[i % SPARK_COLORS.length];
    p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 680);
  }
}

function showStatus(text, isWarn) {
  clearTimeout(statusTimer);
  statusNode.className = isWarn ? 'warn' : '';
  statusNode.textContent = text;
  if (!isWarn) {
    statusTimer = setTimeout(() => { statusNode.textContent = ''; }, 3200);
  }
}

function success(button, text, toast) {
  const label = button.querySelector('.btn-label') || button;
  const ico = button.querySelector('.btn-ico');
  if (!button.dataset.origLabel) button.dataset.origLabel = label.textContent;
  if (ico && !button.dataset.origIco) button.dataset.origIco = ico.innerHTML;
  label.textContent = text;
  if (ico) ico.innerHTML = CHECK_SVG;
  button.classList.add('done');
  burstSparks(button);
  showStatus(toast, false);
  clearTimeout(button._t);
  button._t = setTimeout(() => {
    label.textContent = button.dataset.origLabel;
    if (ico) ico.innerHTML = button.dataset.origIco;
    button.classList.remove('done');
  }, 2100);
}

function toggleZoom() {
  const grid = document.getElementById('card-content');
  const btn = document.getElementById('zoom-toggle');
  const expanded = grid.classList.toggle('expanded');
  if (btn) {
    const span = btn.querySelector('span');
    if (span) span.textContent = expanded ? 'Vista dividida' : 'Ampliar HD';
  }
}

async function copyText(button) {
  const text = msgNode.textContent;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      throw new Error('fallback');
    }
    success(button, '¡Mensaje copiado!', '✓ Mensaje copiado al portapapeles. Pégalo en tu conversación de WhatsApp.');
  } catch (error) {
    const input = document.createElement('textarea');
    input.value = text;
    input.style.cssText = 'position:fixed;left:-9999px';
    document.body.appendChild(input);
    input.select();
    let copied = false;
    try { copied = document.execCommand('copy'); } catch (e) {}
    input.remove();
    if (copied) {
      success(button, '¡Mensaje copiado!', '✓ Mensaje copiado al portapapeles. Pégalo en tu conversación de WhatsApp.');
    } else {
      showStatus('Selecciona el texto del mensaje manualmente o descarga el archivo TXT desde el panel.', true);
    }
  }
}

async function copyImage(button) {
  try {
    const bytes = Uint8Array.from(atob(document.getElementById('report-image').src.split(',')[1]), c => c.charCodeAt(0));
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': new Blob([bytes], { type: 'image/png' }) })]);
    success(button, '¡Imagen copiada!', '✓ Imagen copiada al portapapeles. Pégala directamente en tu chat de WhatsApp.');
  } catch (error) {
    showStatus('Tu navegador bloqueó la copia directa de imagen. Usa "Descargar PNG" o clic derecho → Copiar imagen.', true);
  }
}
</script>
</body>
</html>
